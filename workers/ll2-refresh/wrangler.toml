# Scheduled refresh of the upcoming-launches feed (see index.ts).
#
# Deploy from this directory:   npx wrangler deploy
# Test locally:                 npx wrangler dev --test-scheduled
#                               curl "http://localhost:8787/__scheduled?cron=*/15+*+*+*+*"
#
# The KV id must be the SAME namespace bound as LAUNCHES_CACHE in the Pages
# project (Workers & Pages → ephemeris-project → Settings → Bindings). A
# different namespace would refresh a copy nobody reads.
#
# Optional: `npx wrangler secret put LL2_TOKEN` if a Space Devs key is added.

name = "ephemeris-ll2-refresh"
main = "index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "LAUNCHES_CACHE"
id = "83f1d51993eb42a3bf97e0bcd7c99875"   # Ephemeris-launches

[observability]
enabled = true
