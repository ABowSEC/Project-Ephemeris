# Keeps the upcoming-launches feed in Workers KV current (see
# scripts/refresh-launches.ts for why this runs here and not on Cloudflare).
#
# Secrets: CLOUDFLARE_API_TOKEN, a token scoped to "Workers KV Storage: Edit"
# on this account. Variables: CLOUDFLARE_ACCOUNT_ID, KV_NAMESPACE_ID.
#
# GitHub runs schedules on a best-effort basis (delays of several minutes are
# normal) and pauses them after 60 days without repository activity. The site
# keeps serving the last good copy either way, and /api/status shows its age.

name: Refresh launch data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-launches
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/refresh-launches.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/refresh-launches.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
