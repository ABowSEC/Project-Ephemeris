name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The orbital crate compiles to WebAssembly during `npm run build`
      # (prebuild -> wasm-pack). Cached so it doesn't rebuild from scratch
      # on every run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orbital

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Pure math with no I/O, so these run fast and catch the kind of sign and
      # unit-conversion errors that are invisible in a rendered UI.
      - run: cargo test --manifest-path crates/orbital/Cargo.toml

      - run: npm run build
